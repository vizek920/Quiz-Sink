<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم المضيف — لعبة السفن والأسئلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Almarai:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#051520; --deep2:#0a2233; --panel:#0f2c40; --panel2:#123049;
    --turquoise:#4fd8c4; --gold:#f2b84b; --coral:#f2704f; --sand:#fbf3e7;
    --line:rgba(251,243,231,0.14); --green:#5ad18a; --red:#f2704f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;
    background:linear-gradient(180deg,var(--deep) 0%, var(--deep2) 60%, #04101a 100%);
    color:var(--sand);font-family:'Tajawal',sans-serif;}
  .wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px;}

  header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(242,184,75,.4));}
  .brand h1{font-family:'Almarai',sans-serif;font-size:17px;font-weight:800;margin:0;
    background:linear-gradient(90deg,var(--turquoise),var(--gold),var(--coral));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand small{display:block;color:rgba(251,243,231,.5);font-size:11px;}
  .open-display{font-size:12px;color:var(--deep);background:linear-gradient(90deg,var(--turquoise),var(--gold));
    border:none;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;}

  .card{background:linear-gradient(160deg,var(--panel),#0a1e2c);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;margin-bottom:16px;}
  .card h2{font-family:'Almarai',sans-serif;font-size:13px;letter-spacing:1px;color:var(--gold);margin:0 0 12px;}

  /* Round controls */
  .round-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:'Tajawal',sans-serif;font-weight:700;font-size:13px;border:1px solid var(--line);
    background:rgba(255,255,255,0.04);color:var(--sand);border-radius:10px;padding:9px 16px;cursor:pointer;transition:all .2s;}
  .btn:hover{background:rgba(255,255,255,0.08);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:linear-gradient(90deg,var(--turquoise),var(--gold));color:var(--deep);border:none;}
  .btn.danger{background:linear-gradient(90deg,#f2704f,#f24f6f);color:#fff;border:none;}
  .name-inputs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .name-inputs input{flex:1;min-width:160px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;color:var(--sand);font-family:'Tajawal',sans-serif;font-size:13px;}
  .name-inputs input:focus{outline:2px solid var(--gold);}

  /* Categories */
  .cat-row{display:flex;gap:8px;flex-wrap:wrap;}
  .cat-btn{font-family:'Almarai',sans-serif;font-weight:700;font-size:12px;padding:8px 16px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--sand);cursor:pointer;transition:.2s;}
  .cat-btn:hover{border-color:var(--gold);}
  .cat-btn:disabled{opacity:.35;cursor:not-allowed;}

  /* Question */
  .qbox{margin-top:14px;min-height:20px;}
  .qtext{font-size:16px;font-weight:700;line-height:1.7;}
  .qmeta{font-size:11px;color:rgba(251,243,231,.45);margin-top:4px;}
  .answer-row{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .answer-box{background:rgba(90,209,138,0.12);border:1px solid rgba(90,209,138,.4);border-radius:10px;
    padding:8px 12px;font-size:13px;color:#bdf2d2;display:none;}
  .answer-box.show{display:block;}

  /* Buzz / judging */
  .buzz-row{display:flex;gap:12px;flex-wrap:wrap;}
  .buzz-btn{flex:1;min-width:150px;font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;
    padding:16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,0.03);
    color:var(--sand);cursor:pointer;transition:.2s;}
  .buzz-btn.a{border-color:rgba(79,216,196,.4);}
  .buzz-btn.b{border-color:rgba(242,112,79,.4);}
  .buzz-btn:hover:not(:disabled){transform:translateY(-2px);}
  .buzz-btn:disabled{opacity:.3;cursor:not-allowed;}

  .judge-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .judge-team{font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;}
  .judge-btns{display:flex;gap:10px;}
  .judge-btns .btn.correct{background:linear-gradient(90deg,#5ad18a,#4fd8c4);color:var(--deep);border:none;}
  .judge-btns .btn.wrong{background:linear-gradient(90deg,#f2704f,#f24f6f);color:#fff;border:none;}

  /* Board */
  .board-area{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(56px,72px));grid-template-rows:repeat(4,minmax(56px,72px));
    gap:7px;padding:12px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid var(--line);}
  .cell{position:relative;border-radius:9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;font-family:'Almarai',sans-serif;font-weight:800;
    font-size:13px;color:rgba(251,243,231,.35);cursor:pointer;transition:.15s;user-select:none;}
  .cell:hover:not(.disabled){background:rgba(255,255,255,0.12);transform:scale(1.04);}
  .cell.disabled{cursor:not-allowed;}
  .cell.hit1{background:linear-gradient(160deg,var(--coral),#c94e33);border-color:var(--coral);color:#fff;}
  .cell.hit2{background:linear-gradient(160deg,var(--gold),#c98a2c);border-color:var(--gold);color:var(--deep);}
  .cell.miss{background:rgba(255,255,255,0.02);}
  .cell.miss::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);}
  .board-hint{font-size:11px;color:rgba(251,243,231,.4);text-align:center;}

  /* Scoreboard */
  .score-row{display:flex;justify-content:center;gap:40px;align-items:center;}
  .score-item{text-align:center;}
  .score-item .name{font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;margin-bottom:4px;}
  .score-item.a .name{color:var(--turquoise);}
  .score-item.b .name{color:var(--coral);}
  .score-item .num{font-family:'Almarai',sans-serif;font-weight:800;font-size:30px;}
  .score-vs{color:rgba(251,243,231,.3);font-weight:800;font-size:13px;}

  .win-box{text-align:center;padding:10px 0;}
  .win-box .t{font-family:'Almarai',sans-serif;font-weight:800;font-size:20px;
    background:linear-gradient(90deg,var(--turquoise),var(--gold),var(--coral));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .win-box .s{font-size:12px;color:rgba(251,243,231,.5);margin-top:6px;}

  .empty-state{color:rgba(251,243,231,.4);font-size:13px;text-align:center;padding:10px 0;}

  select#customCat{appearance:none;-webkit-appearance:none;padding-left:28px;}
  .custom-item{display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;margin-bottom:6px;font-size:12px;}
  .custom-item .txt{flex:1;}
  .custom-item .cat-tag{color:var(--gold);font-weight:700;margin-left:6px;}
  .custom-item .del{background:none;border:none;color:var(--coral);cursor:pointer;font-size:14px;padding:2px 6px;}
  .custom-item .del:hover{color:#ff8a6a;}

  .watermark{position:fixed;bottom:10px;left:14px;font-family:'Almarai',sans-serif;font-weight:700;font-size:11px;
    letter-spacing:2px;color:rgba(251,243,231,0.22);display:flex;align-items:center;gap:5px;}
  .watermark .dot{width:4px;height:4px;border-radius:50%;background:linear-gradient(90deg,var(--turquoise),var(--gold),var(--coral));}
</style>
</head>

  <div class="card">

      <div class="score-item b"><div class="name" id="scoreNameB">فريق المرجان</div><div class="num" id="scoreB">0</div></div>

    <div class="round-row" style="margin-bottom:10px;">
      <select id="customCat" class="btn" style="cursor:pointer;"></select>
    </div>
    <div class="name-inputs">
      <input id="customQ" type="text" placeholder="نص السؤال">
      <input id="customA" type="text" placeholder="الإجابة الصحيحة">
    </div>
    <div class="round-row" style="margin-top:10px;">
      <button class="btn primary" id="addCustomBtn">إضافة السؤال إلى البنك</button>
    </div>

  </div>

      <div class="empty-state">اختر فئة لعرض سؤال جديد</div>
    </div>

        <button class="btn correct" id="btnCorrect">✅ إجابة صحيحة</button>
        <button class="btn wrong" id="btnWrong">❌ إجابة خاطئة</button>

<script src="game.js"></script>
<script>
let state = loadState();

function teamLabel(t){ return t==='a' ? state.teamNames.a : state.teamNames.b; }

/* ---------- إدارة الأسئلة الخاصة ---------- */
function populateCustomCatSelect(){
  const sel = document.getElementById('customCat');
  sel.innerHTML = '';
  Object.keys(QUESTION_BANK).forEach(key=>{
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = QUESTION_BANK[key].label;
    sel.appendChild(opt);
  });
}
function renderCustomList(){
  const wrap = document.getElementById('customList');
  const custom = loadCustomQuestions();
  const entries = [];
  Object.keys(custom).forEach(catKey=>{
    (custom[catKey]||[]).forEach(item=>{
      entries.push({ catKey, ...item });
    });
  });
  if(!entries.length){
    wrap.innerHTML = '<div class="empty-state">لم تُضف أي أسئلة خاصة بعد</div>';
    return;
  }
  wrap.innerHTML = '';
  entries.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'custom-item';
    const catLabel = QUESTION_BANK[item.catKey] ? QUESTION_BANK[item.catKey].label : item.catKey;
    row.innerHTML = `<div class="txt"><span class="cat-tag">[${catLabel}]</span> ${item.q}</div>`;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = 'حذف السؤال';
    del.onclick = ()=>{ removeCustomQuestion(item.catKey, item.id); renderCustomList(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });
}
document.getElementById('addCustomBtn').onclick = ()=>{
  const cat = document.getElementById('customCat').value;
  const q = document.getElementById('customQ').value.trim();
  const a = document.getElementById('customA').value.trim();
  if(!q || !a){ alert('الرجاء كتابة نص السؤال والإجابة قبل الإضافة'); return; }
  addCustomQuestion(cat, q, a);
  document.getElementById('customQ').value = '';
  document.getElementById('customA').value = '';
  renderCustomList();
};
populateCustomCatSelect();
renderCustomList();

function render(){
  document.getElementById('nameA').value = state.teamNames.a;
  document.getElementById('nameB').value = state.teamNames.b;
  document.getElementById('scoreNameA').textContent = state.teamNames.a;
  document.getElementById('scoreNameB').textContent = state.teamNames.b;
  document.getElementById('scoreA').textContent = state.scoreA;
  document.getElementById('scoreB').textContent = state.scoreB;

  // Win box
  const winBox = document.getElementById('winBox');
  if(state.phase === 'finished' && state.winner){
    winBox.style.display='block';
    document.getElementById('winTitle').textContent = `🏆 ${teamLabel(state.winner)} يفوز بالجولة!`;
    document.getElementById('winSub').textContent = `النتيجة النهائية: ${state.finalScoreText}`;
  } else {
    winBox.style.display='none';
  }

  // Categories
  const catRow = document.getElementById('catRow');
  catRow.innerHTML = '';
  Object.keys(QUESTION_BANK).forEach(key=>{
    const b = document.createElement('button');
    b.className='cat-btn';
    b.textContent = QUESTION_BANK[key].label;
    b.disabled = state.phase !== 'idle' || state.phase==='finished';
    b.onclick = ()=>{ unlockAudio(); state = Game.askQuestion(state, key); render(); };
    catRow.appendChild(b);
  });

  // Question box
  const qbox = document.getElementById('qbox');
  if(state.questionText){
    qbox.innerHTML = `
      <div class="qtext">${state.questionText}</div>
      <div class="qmeta">الفئة: ${QUESTION_BANK[state.category] ? QUESTION_BANK[state.category].label : ''}</div>
      <div class="answer-row">
        <button class="btn" id="toggleAnswer">${state.answerShown ? 'إخفاء الإجابة' : 'إظهار الإجابة (للمضيف فقط)'}</button>
      </div>
      <div class="answer-box ${state.answerShown?'show':''}">${state.answerText||''}</div>
    `;
    const ta = document.getElementById('toggleAnswer');
    if(ta) ta.onclick = ()=>{ state = Game.toggleAnswer(state); render(); };
  } else if(state.phase === 'finished'){
    qbox.innerHTML = `<div class="empty-state">انتهت الجولة. اضغط "بدء جولة جديدة" للمتابعة.</div>`;
  } else {
    qbox.innerHTML = `<div class="empty-state">اختر فئة لعرض سؤال جديد</div>`;
  }

  // Buzz card
  const buzzCard = document.getElementById('buzzCard');
  const buzzRow = document.getElementById('buzzRow');
  const showBuzz = (state.phase==='question' || state.phase==='judging_other');
  buzzCard.style.display = showBuzz ? 'block' : 'none';
  if(showBuzz){
    buzzRow.innerHTML='';
    ['a','b'].forEach(team=>{
      const disabledForFirstAttempt = state.phase==='judging_other' && team !== state.__otherTeam;
      const btn = document.createElement('button');
      btn.className = 'buzz-btn '+team;
      btn.textContent = teamLabel(team) + ' بزّت 🔔';
      btn.disabled = disabledForFirstAttempt;
      btn.onclick = ()=>{ unlockAudio(); Sound.buzz(); state = Game.buzz(state, team); render(); };
      buzzRow.appendChild(btn);
    });
  }

  // Judging card
  const judgeCard = document.getElementById('judgeCard');
  judgeCard.style.display = state.phase==='judging' ? 'block' : 'none';
  if(state.phase==='judging'){
    document.getElementById('judgeTeamLabel').textContent = teamLabel(state.activeTeam) + ' يحاول الإجابة الآن:';
  }

  // Board card
  const boardCard = document.getElementById('boardCard');
  boardCard.style.display = (state.phase==='attacking') ? 'block' : 'none';
  document.getElementById('attackHint').textContent = state.phase==='attacking'
    ? `دور ${teamLabel(state.activeTeam)} — اضغط المربع الذي أعلنه الفريق`
    : '';
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  for(let i=0;i<16;i++){
    const c = document.createElement('div');
    c.className='cell';
    const rv = state.revealed[String(i)];
    if(rv){
      c.classList.add(rv);
      c.classList.add('disabled');
      c.textContent = rv==='miss' ? '' : (rv==='hit1' ? '١' : '٢');
    } else {
      if(state.phase !== 'attacking') c.classList.add('disabled');
      c.onclick = ()=>{
        if(state.phase!=='attacking') return;
        const prevScoreA = state.scoreA, prevScoreB = state.scoreB;
        const wasHit = state.ship1.includes(i) || state.ship2.includes(i);
        state = Game.attackCell(state, i);
        if(wasHit){
          Sound.hit();
          const key = String(i);
          const rvNow = state.revealed[key];
          const shipArr = rvNow==='hit1' ? state.ship1 : state.ship2;
          const sunkNow = shipArr.every(cc => state.revealed[String(cc)] && state.revealed[String(cc)]!=='miss');
          if(sunkNow) setTimeout(()=>Sound.sunk(), 200);
          if(state.phase==='finished') setTimeout(()=>Sound.win(), 500);
        } else {
          Sound.miss();
        }
        render();
      };
    }
    grid.appendChild(c);
  }
}

document.getElementById('saveNames').onclick = ()=>{
  const a = document.getElementById('nameA').value.trim();
  const b = document.getElementById('nameB').value.trim();
  state = Game.setTeamNames(state, a, b);
  render();
};
document.getElementById('newRound').onclick = ()=>{
  if(state.phase!=='idle' && state.phase!=='finished'){
    if(!confirm('في جولة جارية الآن — هل تريد إنهاؤها وبدء جولة جديدة؟')) return;
  }
  state = Game.newRound(state);
  render();
};
document.getElementById('btnCorrect').onclick = ()=>{ state = Game.judge(state, true); render(); };
document.getElementById('btnWrong').onclick = ()=>{ state = Game.judge(state, false); render(); };

subscribeState((incoming)=>{ state = incoming; render(); });
render();
</script>
</body>
</html>
